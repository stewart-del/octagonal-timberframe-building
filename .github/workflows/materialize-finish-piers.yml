name: Materialize verified floor and support update
on:
  push:
    branches: [codex/publish-finish-piers-20261103]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the exact verified mobile build
        run: |
          python3 scripts/build.py
          python3 - <<'PYCODE'
          import hashlib,pathlib
          b=pathlib.Path('index.html').read_bytes()
          assert len(b)==22812457
          assert hashlib.sha256(b).hexdigest()=='9b9ab7f890992c99d6af075a465ba95c56cbcfb9b1706e7f78c444ad42eff261'
          PYCODE
      - name: Save verified build with contents permission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Materialize checksum-verified mobile viewer'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
