name: Materialize checksum-verified saved viewer
on:
  push:
    branches: [codex/publish-saved-timberframe-20261102]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the saved source and require the exact accepted artifact
        run: |
          python3 scripts/build.py
          printf '%s\n' '19db1441f86ccd36161a60192b03c2cc664afbfcfd3dd07bdace2fb90ee02ce2  index.html' | sha256sum --check
          test "$(git hash-object index.html)" = 1329cef3ad7397789b405d5faad9791cfc7aa548
      - name: Save the verified artifact and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/materialize-saved-build.yml
          git commit -m 'Materialize exact saved viewer and remove publication helper'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
