name: Check R01 geometry and viewer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Use a supported wheel ABI instead of tracking unreleased/new Python ABIs.
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build.py
      # TIMESTAMP START 2026-11-01T22:44:38-05:00 | REVISION R004653
      - run: "python3 -m pip install --only-binary=:all: numpy manifold3d==3.5.4"
      - run: python3 tests/test_joinery.py
      - run: python3 tests/test_r01_geometry.py
      # TIMESTAMP END 2026-11-01T22:44:38-05:00 | REVISION R004653
      - run: python3 tests/validate_model.py dist/index.html
      - run: python3 tests/validate_exports.py
      - run: node --check tests/viewer-script-check.js
      - run: node tests/check_viewer.cjs
      - run: node tests/viewer-regression.cjs dist/index.html
      - run: node tests/multi-selection.cjs src/viewer.template.html
      - run: node tests/mouse-look-regression.cjs src/viewer.template.html
      - run: node tests/surface-contrast.cjs src/viewer.template.html
      - run: node tests/edge-measurements.cjs
      - run: node tests/cavity-overlay.cjs
